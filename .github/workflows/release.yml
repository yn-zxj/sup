name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端产物 web/dist 会经 rust-embed 打进二进制，必须先构建
      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # AI 服务 bundle 也会嵌入二进制
      - name: Build AI bundle
        working-directory: ai
        run: |
          npm ci
          npm run bundle

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf sup-${{ matrix.target }}.tar.gz sup
          shasum -a 256 sup-${{ matrix.target }}.tar.gz > sup-${{ matrix.target }}.tar.gz.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sup-${{ matrix.target }}.tar.gz
            sup-${{ matrix.target }}.tar.gz.sha256
